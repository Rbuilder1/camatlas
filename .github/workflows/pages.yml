# Rebuilds the hosted CamAtlas (the iPhone / any-browser version) and publishes it to GitHub Pages:
# on every push, every 6 hours so the camera lists stay current, and by hand from the Actions tab.
name: Publish CamAtlas web app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download camera lists and build the site
        run: python web/build_static.py --out site
      # Springs and gas stations for NY/NJ/CT, pre-built so the map doesn't depend on the busy public
      # Overpass servers there. The state extracts are cached for the week (Geofabrik updates daily).
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: osm
          key: osm-${{ steps.week.outputs.week }}
      - name: Build map places (springs, gas stations)
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir -p osm
          for s in new-york new-jersey connecticut; do
            [ -f "osm/$s.osm.pbf" ] || curl -sSfL --retry 3 -o "osm/$s.osm.pbf" "https://download.geofabrik.de/north-america/us/$s-latest.osm.pbf"
            [ -f "osm/$s.poly" ] || curl -sSfL --retry 3 -o "osm/$s.poly" "https://download.geofabrik.de/north-america/us/$s.poly"
          done
          python web/build_places.py --out site/places osm/new-york.osm.pbf osm/new-jersey.osm.pbf osm/connecticut.osm.pbf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
