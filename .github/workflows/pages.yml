# Rebuilds the hosted CamAtlas (the iPhone / any-browser version) and publishes it to GitHub Pages:
# on every push, every 6 hours so the camera lists stay current, and by hand from the Actions tab.
name: Publish CamAtlas web app

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download camera lists and build the site
        run: python web/build_static.py --out site
      # Springs, gas stations and power plants for every US state, pre-built so the map doesn't depend
      # on the busy public Overpass servers. Each state extract (about 11 GB for the lot) is cut down to
      # just those places as soon as it lands, and only the small files are cached, for the week.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: osm
          key: osm-us2-${{ steps.week.outputs.week }}
      - name: Build map places (springs, gas stations, power plants)
        run: |
          sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir -p osm
          G=https://download.geofabrik.de/north-america/us
          for s in alabama alaska arizona arkansas california colorado connecticut delaware district-of-columbia \
                   florida georgia hawaii idaho illinois indiana iowa kansas kentucky louisiana maine maryland \
                   massachusetts michigan minnesota mississippi missouri montana nebraska nevada new-hampshire \
                   new-jersey new-mexico new-york north-carolina north-dakota ohio oklahoma oregon pennsylvania \
                   puerto-rico rhode-island south-carolina south-dakota tennessee texas us-virgin-islands utah \
                   vermont virginia washington west-virginia wisconsin wyoming; do
            [ -f "osm/$s.osm.pbf" ] && [ -f "osm/$s.poly" ] && continue
            if curl -sSfL --retry 3 -o full.osm.pbf "$G/$s-latest.osm.pbf" && curl -sSfL --retry 3 -o "osm/$s.poly" "$G/$s.poly" &&
               osmium tags-filter --overwrite -o "osm/$s.osm.pbf" full.osm.pbf n/natural=spring nwr/amenity=fuel nwr/power=plant; then
              echo "$s: $(du -h "osm/$s.osm.pbf" | cut -f1)"
            else
              echo "::warning::$s skipped (download failed); its tiles fall back to Overpass"
              rm -f "osm/$s.osm.pbf" "osm/$s.poly"
            fi
            rm -f full.osm.pbf
          done
          python web/build_places.py --out site/places osm/*.osm.pbf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
